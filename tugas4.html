<!DOCTYPE html>
<html>
<head>
    <title>Kasir Toko Elektronik RPL</title>
</head>
<body>
	<h2>Aplikasi Kasir Elektronik (Menggunakan Fungsi)</h2>
<script>
    // Fungsi menghitung diskon
    function hitungDiskon(totalBelanja) {
        if (totalBelanja >= 200000) {
            return totalBelanja * 0.20;
        } else if (totalBelanja >= 100000) {
            return totalBelanja * 0.10;
        } else {
            return 0;
        }
    }

    // Input data
    let namaPembeli = prompt("Masukkan nama pembeli:");

    let namaBarang1 = prompt("Masukkan nama barang 1:");
    let hargaBarang1 = Number(prompt("Masukkan harga barang 1:"));

    let namaBarang2 = prompt("Masukkan nama barang 2:");
    let hargaBarang2 = Number(prompt("Masukkan harga barang 2:"));

    // Proses
    let totalBelanja = hargaBarang1 + hargaBarang2;

    let nominalDiskon = hitungDiskon(totalBelanja);

    let totalBayar = totalBelanja - nominalDiskon;

    // Output struk
    document.write("<hr>");
    document.write("<h3>STRUK TOKO ELEKTRONIK RPL</h3>");
    document.write("<hr>");

    document.write("Nama Pembeli : " + namaPembeli + "<br><br>");

    document.write("1. " + namaBarang1 + " : Rp "
        + hargaBarang1.toLocaleString("id-ID") + "<br>");

    document.write("2. " + namaBarang2 + " : Rp "
        + hargaBarang2.toLocaleString("id-ID") + "<br><br>");

    document.write("Total Belanja : Rp "
        + totalBelanja.toLocaleString("id-ID") + "<br>");

    document.write("Potongan Diskon : Rp "
        + nominalDiskon.toLocaleString("id-ID") + "<br>");

    document.write("Total Bayar : Rp "
        + totalBayar.toLocaleString("id-ID") + "<br>");

    document.write("<hr>");
</script>

</body>
</html>
